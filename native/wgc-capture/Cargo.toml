[package]
name = "wgc-capture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
windows-capture = "2.0.0"
half = "2"
# Parallel RGBA16F -> RGBA8 conversion (hdr.rs). Already a transitive
# dependency via windows-capture, so this adds nothing to the build.
rayon = "1"
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Graphics_Capture",
    # IGraphicsCaptureItemInterop, so a failed capture can re-attempt
    # CreateForWindow directly and recover the HRESULT that windows-capture
    # discards when it maps every conversion failure to `ItemConvertFailed`.
    "Win32_System_WinRT_Graphics_Capture",
    # RegGetValueW: read the Windows screenshots-privacy consent
    # (CapabilityAccessManager ConsentStore) into the failure diagnostics — a
    # 'Deny' there blocks CreateForWindow for every capture backend at once.
    "Win32_System_Registry",
    "Win32_Security",
    # MonitorFromWindow + GetMonitorInfoW: the monitor whose HDR state decides
    # the capture's frame format (see src/hdr.rs).
    "Win32_Graphics_Gdi",
    # Long-exposure DirectCompute backend (see src/longexp/). D3D11 + the runtime
    # HLSL compiler (d3dcompiler_47.dll, a Windows system component since 8.1) are
    # all this feature needs — no CUDA toolkit, no per-architecture build, nothing
    # for the end user to install.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # GetCurrentThreadId / PostThreadMessageW: how the accumulation session's
    # capture thread is unblocked on finish, even when the target stopped presenting.
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 2
