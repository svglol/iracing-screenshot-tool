name: Release

# `npm run release <major|minor|patch>` bumps, commits and tags locally, then
# pushes the tag — which lands here. Everything from "build the installer"
# onward is this workflow's job; release.js no longer builds or uploads.
on:
    push:
        tags:
            - 'v*'

# The workflow creates a draft release, uploads the signed assets into it with
# gh, and the final step flips it out of draft. All need write access.
permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        # Pinned to windows-2022, NOT windows-latest — see the note in ci.yml.
        # VS 2026 (the windows-latest default since June 2026) hits a C1001
        # internal compiler error on node-addon-api while building
        # @irsdk-node/native, which fails `npm ci`. This must stay in step with
        # the runner ci.yml uses, so the release builds what CI tested.
        runs-on: windows-2022
        # ~40 minutes of build plus up to 30 minutes waiting for a signing
        # approval (see the SignPath step).
        timeout-minutes: 90

        env:
            # Which SignPath policy signs this release.
            #
            # test-signing uses the self-signed test certificate: it proves the
            # pipeline end to end but Windows does not trust it, so releases
            # signed with it must not ship to users. Flip to release-signing
            # once the Foundation's release certificate shows VALID in SignPath
            # — and in the SAME change add
            #     "publisherName": ["SignPath Foundation"]
            # to package.json's build.win, so electron-updater starts verifying
            # the signature of every downloaded update.
            SIGNPATH_SIGNING_POLICY: test-signing

        steps:
            - uses: actions/checkout@v4
              with:
                  # Release notes fall back to `git log <prevTag>..<tag>`, which
                  # needs real history — the default shallow clone has none.
                  fetch-depth: 0

            # A tag whose semver disagrees with package.json produces an installer
            # named for one version published under another. Fail before the
            # 40-minute build rather than after it.
            - name: Verify tag matches package.json
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
                    exit 1
                  fi
                  echo "Releasing $GITHUB_REF_NAME"

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: native/wgc-capture

            # native/wgc-capture.node is committed for contributors' `npm run dev`,
            # but a release must never ship a binary older than src/lib.rs.
            # Rebuild and overwrite it before electron-builder packages it in.
            - name: Build native WGC addon
              shell: bash
              run: |
                  cargo build --release --manifest-path native/wgc-capture/Cargo.toml
                  cp native/wgc-capture/target/release/wgc_capture.dll native/wgc-capture.node

            # postinstall rebuilds irsdk-node and sharp against Electron's headers.
            - name: Install dependencies
              run: npm ci

            - name: Test
              run: npm test

            - name: Build bundles
              run: npm run pack

            # Create the draft BEFORE anything uploads, and flip it public only
            # at the very end, so a failed run never leaves a half-populated
            # release visible to users. Idempotent on purpose: a re-run after a
            # failed build reuses the existing draft rather than failing on
            # "already exists".
            #
            # (This step predates the signing split, when two concurrent
            # electron-builder GitHub publishers — one per target — would race
            # to create the release and split the assets between them; v3.3.0
            # shipped without its installer that way. electron-builder no
            # longer uploads anything, so the race is gone, but the pre-created
            # draft still keeps re-runs and the publish flip safe.)
            - name: Create draft release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  if gh release view "$tag" >/dev/null 2>&1; then
                    echo "Release $tag already exists — reusing it."
                  else
                    gh release create "$tag" \
                      --draft \
                      --title "$tag" \
                      --notes "Build in progress — this text is replaced when the release is published."
                  fi

            # Produces the NSIS installer, the portable exe, the .blockmap and
            # latest.yml in build/ WITHOUT publishing. Signing has to happen
            # between packaging and upload, so the electron-builder publishers
            # are out of the loop entirely — gh uploads the finished assets
            # below.
            - name: Package installers
              run: npx electron-builder --publish never

            # The unsigned executables travel to SignPath as a workflow
            # artifact. GitHub delivers those as a ZIP, which is why the
            # SignPath project's artifact configuration must have a <zip-file>
            # root containing the pe-file entries for both executables.
            - name: Stage unsigned executables
              id: unsigned
              uses: actions/upload-artifact@v4
              with:
                  name: unsigned-executables
                  path: build/*.exe
                  if-no-files-found: error

            # Submits the signing request and waits for the signed artifact.
            #
            # Under release-signing this PAUSES mid-run until someone approves
            # the request in the SignPath UI — approve within the timeout below
            # or the job fails. A re-run rebuilds and resubmits; the draft
            # release is reused.
            - name: Sign executables
              uses: signpath/github-action-submit-signing-request@v2
              with:
                  api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                  organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                  project-slug: iracing-screenshot-tool
                  signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
                  github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
                  wait-for-completion: true
                  wait-for-completion-timeout-in-seconds: 1800
                  output-artifact-directory: build/signed

            # Signing changed every byte electron-builder hashed, so the
            # update manifest and blockmap must be rebuilt from the SIGNED
            # executables — electron-updater verifies sha512 before applying an
            # update, and a stale manifest means every client downloads the
            # update and then refuses it. The script also renames the
            # artifacts to the dash-separated names latest.yml's `url` field
            # already points at (see sign-helpers.js for why gh must not upload
            # the space-named files).
            - name: Rebuild update manifest from signed executables
              shell: bash
              run: |
                  cp build/signed/*.exe build/
                  node _scripts/finalize-signed-artifacts.js build

            - name: Upload artifacts
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "$GITHUB_REF_NAME" \
                    build/*.exe \
                    build/*.exe.blockmap \
                    build/latest.yml \
                    --clobber

            # Attach the notes and take the release out of draft, so a failed build
            # above never leaves a half-populated release visible to users.
            - name: Publish release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  version="${tag#v}"
                  notes="RELEASE-NOTES-${tag}.md"

                  # Two guards, both learned from v3.3.0.
                  #
                  # The first catches the duplicate-release race directly: if the
                  # step above ever fails to prevent it, `gh release edit` picks
                  # one of the candidates arbitrarily and there is a 50% chance
                  # of publishing the empty one. Fail loudly instead.
                  count="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                    --jq "[.[] | select(.tag_name == \"${tag}\")] | length")"
                  if [ "$count" != "1" ]; then
                    echo "::error::Expected exactly 1 release for ${tag}, found ${count}. Refusing to publish."
                    exit 1
                  fi

                  # The second is the check that would have caught v3.3.0 whatever
                  # the cause: nothing goes public until the artifacts users
                  # actually need are attached. latest.yml is the one that fails
                  # silently — a release without it breaks auto-update for
                  # everyone while looking perfectly fine on the releases page.
                  #
                  # Deliberately NOT matching exact filenames. The artifact naming
                  # has already changed once (v3.1.1 shipped
                  # "iRacing.Screenshot.Tool.Setup.3.1.1.exe", dot-separated), and
                  # a guard pinned to today's convention would fail every release
                  # after the next rename — turning a safety net into a tripwire.
                  # latest.yml is safe to match exactly: electron-updater fixes
                  # that name, artifactName cannot change it.
                  assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
                  exe_count="$(printf '%s\n' "$assets" | grep -c '\.exe$' || true)"

                  if ! printf '%s\n' "$assets" | grep -qxF 'latest.yml'; then
                    echo "::error::Release ${tag} has no latest.yml — auto-update would be broken for every user. Refusing to publish."
                    echo "Attached assets were:"; printf '  %s\n' $assets
                    exit 1
                  fi

                  # nsis + portable, so two. Fewer means a publisher dropped one.
                  if [ "$exe_count" -lt 2 ]; then
                    echo "::error::Release ${tag} has ${exe_count} .exe asset(s); expected the installer and the portable build. Refusing to publish."
                    echo "Attached assets were:"; printf '  %s\n' $assets
                    exit 1
                  fi

                  # The one thing the presence checks above cannot see is
                  # latest.yml CORRECTNESS: a manifest whose sha512 describes
                  # the unsigned build would make every client download the
                  # update and then refuse to apply it. Compare the manifest as
                  # released against the signed installer on disk.
                  gh release download "$tag" --pattern latest.yml -O released-latest.yml
                  manifest_path="$(grep -m1 '^path:' released-latest.yml | awk '{print $2}')"
                  manifest_sha="$(grep -m1 '^sha512:' released-latest.yml | awk '{print $2}')"
                  local_sha="$(node -e "const c=require('crypto'),f=require('fs');console.log(c.createHash('sha512').update(f.readFileSync('build/'+process.argv[1])).digest('base64'))" "$manifest_path")"
                  if [ "$manifest_sha" != "$local_sha" ]; then
                    echo "::error::latest.yml's sha512 does not match the uploaded installer (${manifest_path}). Auto-update would reject every download. Refusing to publish."
                    exit 1
                  fi

                  echo "Artifacts verified: ${exe_count} .exe + latest.yml (sha512 matches ${manifest_path})"

                  # A prerelease-suffixed tag (v3.4.0-signing.1) is a pipeline
                  # rehearsal, not a release: run every guard above, then STOP,
                  # leaving the draft in place for inspection and deletion.
                  # Flipping it public with --latest would offer the build to
                  # every auto-updating user — which for a rehearsal may be a
                  # test-signed binary Windows does not trust.
                  if [[ "$version" == *-* ]]; then
                    echo "Prerelease tag ${tag}: all checks passed. Leaving the release as a draft."
                    exit 0
                  fi

                  if [ -f "$notes" ]; then
                    echo "Using curated notes: $notes"
                  else
                    echo "No $notes — falling back to the commit log."
                    prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
                    range="${prev:+${prev}..}${tag}"
                    notes=generated-notes.md
                    {
                      echo "## What's Changed"
                      echo
                      git log "$range" --pretty=format:'- %s (%h)' --no-merges
                      echo
                    } > "$notes"
                  fi

                  # --prerelease=false is load-bearing, not tidiness. With
                  # allowPrerelease at its default, electron-updater resolves the
                  # newest version through https://github.com/<owner>/<repo>/releases/latest
                  # (GitHubProvider.getLatestTagName), and GitHub never points that
                  # at a release flagged pre-release — nor does --latest override
                  # the flag. v3.1.0, v3.2.1 and v3.2.2 all shipped pre-release, so
                  # that redirect sat on v3.1.1, which predates latest.yml: every
                  # update check would have 404'd on the channel file.
                  gh release edit "$tag" \
                    --draft=false \
                    --prerelease=false \
                    --latest \
                    --title "$tag" \
                    --notes-file "$notes"
