name: Release

# `npm run release <major|minor|patch>` bumps, commits and tags locally, then
# pushes the tag — which lands here. Everything from "build the installer"
# onward is this workflow's job; release.js no longer builds or uploads.
on:
    push:
        tags:
            - 'v*'

# electron-builder creates the draft release and uploads assets; the final step
# flips it out of draft. Both need write access to contents.
permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        # Pinned to windows-2022, NOT windows-latest — see the note in ci.yml.
        # VS 2026 (the windows-latest default since June 2026) hits a C1001
        # internal compiler error on node-addon-api while building
        # @irsdk-node/native, which fails `npm ci`. This must stay in step with
        # the runner ci.yml uses, so the release builds what CI tested.
        runs-on: windows-2022
        timeout-minutes: 60

        steps:
            - uses: actions/checkout@v4
              with:
                  # Release notes fall back to `git log <prevTag>..<tag>`, which
                  # needs real history — the default shallow clone has none.
                  fetch-depth: 0

            # A tag whose semver disagrees with package.json produces an installer
            # named for one version published under another. Fail before the
            # 40-minute build rather than after it.
            - name: Verify tag matches package.json
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
                    exit 1
                  fi
                  echo "Releasing $GITHUB_REF_NAME"

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: native/wgc-capture

            # native/wgc-capture.node is committed for contributors' `npm run dev`,
            # but a release must never ship a binary older than src/lib.rs.
            # Rebuild and overwrite it before electron-builder packages it in.
            - name: Build native WGC addon
              shell: bash
              run: |
                  cargo build --release --manifest-path native/wgc-capture/Cargo.toml
                  cp native/wgc-capture/target/release/wgc_capture.dll native/wgc-capture.node

            # postinstall rebuilds irsdk-node and sharp against Electron's headers.
            - name: Install dependencies
              run: npm ci

            - name: Test
              run: npm test

            - name: Build bundles
              run: npm run pack

            # Create the draft BEFORE electron-builder runs.
            #
            # package.json builds two targets (nsis + portable), and
            # electron-builder starts one GitHub publisher per target. They run
            # concurrently, each asks "is there a release for this tag?", both
            # get no, and both CREATE one. v3.3.0 came out of this with the
            # installer, the portable exe and latest.yml attached to one release
            # and the .blockmap to another, and the publish step below then
            # flipped the wrong one out of draft — shipping a release with no
            # installer on it. v3.2.2 won the same race by luck.
            #
            # With the draft already there, both publishers find it and upload
            # into it. Idempotent on purpose: a re-run after a failed build
            # reuses the existing draft rather than failing on "already exists".
            - name: Create draft release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  if gh release view "$tag" >/dev/null 2>&1; then
                    echo "Release $tag already exists — reusing it."
                  else
                    gh release create "$tag" \
                      --draft \
                      --title "$tag" \
                      --notes "Build in progress — this text is replaced when the release is published."
                  fi

            # Uploads the NSIS installer, the portable exe, the .blockmap and —
            # critically — latest.yml, which electron-updater fetches to discover
            # new versions. Attaches to the draft created above.
            - name: Package and upload artifacts
              run: npx electron-builder --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Attach the notes and take the release out of draft, so a failed build
            # above never leaves a half-populated release visible to users.
            - name: Publish release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  version="${tag#v}"
                  notes="RELEASE-NOTES-${tag}.md"

                  # Two guards, both learned from v3.3.0.
                  #
                  # The first catches the duplicate-release race directly: if the
                  # step above ever fails to prevent it, `gh release edit` picks
                  # one of the candidates arbitrarily and there is a 50% chance
                  # of publishing the empty one. Fail loudly instead.
                  count="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                    --jq "[.[] | select(.tag_name == \"${tag}\")] | length")"
                  if [ "$count" != "1" ]; then
                    echo "::error::Expected exactly 1 release for ${tag}, found ${count}. Refusing to publish."
                    exit 1
                  fi

                  # The second is the check that would have caught v3.3.0 whatever
                  # the cause: nothing goes public until the artifacts users
                  # actually need are attached. latest.yml is the one that fails
                  # silently — a release without it breaks auto-update for
                  # everyone while looking perfectly fine on the releases page.
                  #
                  # Deliberately NOT matching exact filenames. The artifact naming
                  # has already changed once (v3.1.1 shipped
                  # "iRacing.Screenshot.Tool.Setup.3.1.1.exe", dot-separated), and
                  # a guard pinned to today's convention would fail every release
                  # after the next rename — turning a safety net into a tripwire.
                  # latest.yml is safe to match exactly: electron-updater fixes
                  # that name, artifactName cannot change it.
                  assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
                  exe_count="$(printf '%s\n' "$assets" | grep -c '\.exe$' || true)"

                  if ! printf '%s\n' "$assets" | grep -qxF 'latest.yml'; then
                    echo "::error::Release ${tag} has no latest.yml — auto-update would be broken for every user. Refusing to publish."
                    echo "Attached assets were:"; printf '  %s\n' $assets
                    exit 1
                  fi

                  # nsis + portable, so two. Fewer means a publisher dropped one.
                  if [ "$exe_count" -lt 2 ]; then
                    echo "::error::Release ${tag} has ${exe_count} .exe asset(s); expected the installer and the portable build. Refusing to publish."
                    echo "Attached assets were:"; printf '  %s\n' $assets
                    exit 1
                  fi

                  echo "Artifacts verified: ${exe_count} .exe + latest.yml"

                  if [ -f "$notes" ]; then
                    echo "Using curated notes: $notes"
                  else
                    echo "No $notes — falling back to the commit log."
                    prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
                    range="${prev:+${prev}..}${tag}"
                    notes=generated-notes.md
                    {
                      echo "## What's Changed"
                      echo
                      git log "$range" --pretty=format:'- %s (%h)' --no-merges
                      echo
                    } > "$notes"
                  fi

                  # --prerelease=false is load-bearing, not tidiness. With
                  # allowPrerelease at its default, electron-updater resolves the
                  # newest version through https://github.com/<owner>/<repo>/releases/latest
                  # (GitHubProvider.getLatestTagName), and GitHub never points that
                  # at a release flagged pre-release — nor does --latest override
                  # the flag. v3.1.0, v3.2.1 and v3.2.2 all shipped pre-release, so
                  # that redirect sat on v3.1.1, which predates latest.yml: every
                  # update check would have 404'd on the channel file.
                  gh release edit "$tag" \
                    --draft=false \
                    --prerelease=false \
                    --latest \
                    --title "$tag" \
                    --notes-file "$notes"
